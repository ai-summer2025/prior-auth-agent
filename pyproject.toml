[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "priorauth"
version = "1.0.0"
description = "Prior authorization criteria review: coverage policies as data, three-valued evaluation, grounded LLM fact extraction and auditable letters."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
priorauth = "priorauth.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]

[tool.setuptools.package-data]
priorauth = ["policies/*.json"]
